[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphbridge"
version = "0.1.0.dev0"
description = "Free, offline, open-source translation for every script."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Glyphbridge contributors" }]
keywords = ["translation", "machine-translation", "offline", "nlp", "ocr", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "transformers>=4.38",
  "sentencepiece>=0.1.99",
  "torch>=2.1",
  "sacremoses>=0.1",
  "accelerate>=0.30",
  "huggingface_hub>=0.23",
  "psutil>=5.9",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
checker = ["sentence-transformers>=3.0"]
lid = ["fasttext-wheel>=0.9.2", "huggingface_hub>=0.23"]
mcp = ["mcp>=1.0"]
docs = ["python-docx>=1.1", "pypdf>=4.0"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
mic = ["sounddevice>=0.4.6", "numpy>=1.24"]
small = ["ctranslate2>=4.0", "sentencepiece>=0.1.99", "llama-cpp-python>=0.3"]
detect = ["langdetect>=1.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "python-docx>=1.1"]
all = ["glyphbridge[server,mcp,checker,lid,detect,docs,ocr,mic,small]"]

[project.scripts]
glyphbridge = "glyphbridge.cli:main"

[project.urls]
Homepage = "https://github.com/CooLSavaSs/glyphbridge"
Issues = "https://github.com/CooLSavaSs/glyphbridge/issues"

[tool.setuptools.packages.find]
include = ["glyphbridge*"]
