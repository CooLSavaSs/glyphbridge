name: FLORES-200 (many languages)

# Quality across ~50 languages on human-translated FLORES-200 sentences, with the three wide-coverage
# 8 GB cards (Hy-MT2, TranslateGemma 4-bit, MADLAD int8) and the route table; per-pair Opus-MT
# cards are left out (one 300 MB download per language). Long, so it runs in its own workflow and only when the
# translation code changes (or by hand).
on:
  push:
    branches: [main]
    paths: ["glyphbridge/**", "scripts/flores.py", ".github/workflows/flores.yml"]
  workflow_dispatch:
    inputs:
      backends:
        description: "Cards to use, e.g. madlad-int8, or opus,hymt2-q4,gemma-q4,madlad-int8 to include Opus-MT pair models (default: the three wide-coverage cards)"
        default: "hymt2-q4,gemma-q4,madlad-int8"
      langs:
        description: "FLORES codes separated by spaces (default: all 50)"
        default: ""
      direction:
        description: "x-en (each language into English), en-x (English into each language) or both"
        default: "both"
      sentences:
        description: "Sentences per language (20 = quick; 100 = the planned full run, about 5x longer)"
        default: "20"
      context:
        description: "1 = context window on (LLM cards see the preceding sentence; FLORES sentences are consecutive), compare with a run at 0"
        default: "0"

# Share the heavyweight-model lock with Cards and CI smoke tests.
# This prevents simultaneous multi-GB model downloads and inference jobs.
concurrency:
  group: glyphbridge-heavy-models
  cancel-in-progress: false

jobs:
  flores:
    name: FLORES-200 X->English, wide-coverage 8 GB cards
    runs-on: ubuntu-latest
    timeout-minutes: 340   # both directions; GitHub-hosted jobs stop at 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -e ".[8gb,transformers]" sacrebleu   # transformers: lets a run add per-pair opus cards (backends input)
      - name: Install the 8 GB cards
        run: glyphbridge cards install madlad-int8 gemma-q4 hymt2-q4
      - name: Install madlad-q4 (only when a run asks for it)
        if: ${{ contains(inputs.backends || '', 'madlad-q4') }}
        run: glyphbridge cards install madlad-q4
      - name: FLORES-200, X->English (report only)
        if: ${{ (inputs.direction || 'both') != 'en-x' }}
        env:
          GLYPHBRIDGE_ENABLE_HYMT: "1"
          GLYPHBRIDGE_ENABLE_GEMMA: "1"
          GLYPHBRIDGE_BACKENDS: ${{ inputs.backends || 'hymt2-q4,gemma-q4,madlad-int8' }}
          LANGS: ${{ inputs.langs }}
          N: ${{ inputs.sentences || '20' }}
          GLYPHBRIDGE_CONTEXT: ${{ inputs.context || '0' }}
        run: python scripts/flores.py --direction x-en --sentences "$N" ${LANGS:+--langs $LANGS} --json flores-x-en.json
      - name: FLORES-200, English->X (report only)
        if: ${{ (inputs.direction || 'both') != 'x-en' }}
        env:
          GLYPHBRIDGE_ENABLE_HYMT: "1"
          GLYPHBRIDGE_ENABLE_GEMMA: "1"
          GLYPHBRIDGE_BACKENDS: ${{ inputs.backends || 'hymt2-q4,gemma-q4,madlad-int8' }}
          LANGS: ${{ inputs.langs }}
          N: ${{ inputs.sentences || '20' }}
          GLYPHBRIDGE_CONTEXT: ${{ inputs.context || '0' }}
        run: python scripts/flores.py --direction en-x --sentences "$N" ${LANGS:+--langs $LANGS} --json flores-en-x.json
