name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (without the heavy model backend)
        run: |
          pip install --no-deps -e .
          pip install "fastapi>=0.110" "httpx>=0.27" "pytest>=8"
      - run: pytest -q

  smoke:
    name: Real translation smoke test (CPU)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with CPU-only PyTorch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[server]"
      - name: Translate with the CLI
        run: |
          glyphbridge translate "Merhaba dünya, nasılsın?" --from tr --to en --json | tee out.json
          python -c "import json; d=json.load(open('out.json')); assert d['translation'].strip(), d; print('OK:', d['translation'])"
      - name: Translate through the REST API with an API key
        env:
          GLYPHBRIDGE_API_KEY: ci-test-key
        run: |
          glyphbridge serve --port 8080 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/v1/health && break; sleep 2; done
          curl -sf -o /dev/null -w "%{http_code}\n" -X POST http://127.0.0.1:8080/v1/translate \
            -H "Content-Type: application/json" -d '{"text":"Merhaba","source":"tr","target":"en"}' || echo "401 as expected without key"
          curl -sf http://127.0.0.1:8080/v1/translate \
            -H "Authorization: Bearer $GLYPHBRIDGE_API_KEY" -H "Content-Type: application/json" \
            -d '{"text":"Merhaba dünya","source":"tr","target":"en"}'
