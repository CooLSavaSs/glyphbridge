name: Cards (real models)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest commit matters: cancel older runs instead of queueing 12 GB downloads.
concurrency:
  group: cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  small-cards:
    name: GlotLID, LaBSE checker, OCR, speech, full pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-tur espeak-ng ffmpeg fonts-dejavu-core
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[lid,checker,ocr,docs]"
      - name: Run real-model checks
        run: python scripts/smoke_cards.py lid checker ocr pipeline speech
      - name: Golden-set regression (Opus-MT + checker)
        run: |
          pip install sacrebleu
          python scripts/golden.py tests/golden/v1/tr-en.tsv tests/golden/v1/en-tr.tsv --min-chrf 40 --json golden-opus.json
      - name: Golden set, Latin without TranslateGemma (Opus-MT Italic group model, report only)
        env:
          GLYPHBRIDGE_BACKENDS: opus,opus-group,madlad-int8
        run: python scripts/golden.py tests/golden/v1/la-en.tsv:0 --json golden-opus-itc.json

  madlad:
    name: MADLAD-400 3B (rare languages)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the 12 GB model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Run MADLAD check
        run: python scripts/smoke_cards.py madlad

  small-8gb:
    name: 8 GB cards (MADLAD int8, TranslateGemma 4-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install -e ".[small]"
      - name: Run 8 GB card checks
        run: python scripts/smoke_cards.py --isolate madlad-int8 gemma-q4
      - name: Verify SHA-256 of the 8 GB cards
        run: |
          glyphbridge cards verify madlad-int8
          glyphbridge cards verify gemma-q4
      - name: Golden set, low-resource (MADLAD int8, report only, includes the Gallia case)
        env:
          GLYPHBRIDGE_OFFLINE: "1"
        run: |
          pip install sacrebleu
          python scripts/golden.py tests/golden/v1/la-en.tsv:0 --json golden-8gb.json
      - name: Golden set with TranslateGemma 4-bit first (report only, idioms and Latin experiment)
        env:
          GLYPHBRIDGE_OFFLINE: "1"
          GLYPHBRIDGE_PREFER: quality
          GLYPHBRIDGE_BACKENDS: gemma-q4,madlad-int8
          GLYPHBRIDGE_GEMMA_LANGS: en,tr,la
        run: |
          python scripts/golden.py tests/golden/v1/tr-en.tsv:0 tests/golden/v1/en-tr.tsv:0 tests/golden/v1/la-en.tsv:0 --json golden-gemma.json
